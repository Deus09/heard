[build]
  # Next.js'i derlemek için kullanılan komut.
  command = "npm run build"
  
  # NODE_VERSION'ı burada ayarlamak iyi bir uygulamadır. 
  # Sizin için 18 veya 20 önerilir.
  environment = { NODE_VERSION = "18" }

# Bu eklenti (plugin) kritiktir. 
# Tüm Next.js ayarlarını, yönlendirmeleri ve API işlevlerini yönetir.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# publish ve redirects satırları gereksizdir, 
# çünkü plugin tüm bu işleri sizin yerinize halleder.